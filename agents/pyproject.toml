[project]
name = "ead-agents"
dynamic = ["version"]
description = "AI-driven agent designed to personalize learning on EAD envoirements"
authors = [{ name = "Dionata Silva", email = "dionatasantos.silva@gmail.com" }]
license = "Apache License 2.0"
readme = "README.md"
requires-python = ">=3.13, <4.0"

dependencies = [
    "google-genai>=1.9.0,<2.0.0",
    "pydantic>=2.10.6,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.93.0,<2.0.0",
    "google-adk>=1.0.0,<2.0.0",
    "opik (>=1.7.26,<2.0.0)",
    "a2a-sdk (>=0.2.4,<0.3.0)",
    "llama-index>=0.12.0,<0.13.0",
    "tabulate>=0.9.0,<1.0.0",
    "google-cloud-storage>=2.10.0,<3.0.0",
    "google-auth>=2.36.0,<3.0.0",
    "requests>=2.32.3,<3.0.0",
    "pydantic-settings>=2.8.1,<3.0.0",
]

[project.urls]
homepage = "https://github.com/DioniSilva/sma-ead"
repository = "https://github.com/DioniSilva/sma-ead"
documentation = "https://github.com/DioniSilva/sma-ead"


[tool.poetry]
version = "1.0"
package-mode = false

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
google-adk = { version = "^1.0.0", extras = ["eval"] }
pytest = "^8.3.5"
pytest-mock = "^3.14.0"
scikit-learn = "^1.6.1"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.26.0"
black = "^25.1.0"

[tool.poetry.group.deployment]
optional = true

[tool.poetry.group.deployment.dependencies]
absl-py = "^2.2.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
